name: LNRKernel

# Source: NoGravityKernel (NGK) sm8250 untuk POCO F3 (alioth), dibuild lewat
# compile-alioth.sh bawaan NGK (GPU dtsi, firmware touch, dtb, dtbo AOSP + MIUI).
# Hasil: dua zip terpisah, tanpa pilihan tombol saat flash:
#   LNRKernel-<tanggal>-nonksu.zip  -> tanpa KernelSU (Magisk tetap utuh kalau ada)
#   LNRKernel-<tanggal>-ksun.zip    -> KernelSU Next
#
# Catatan source NGK: drivers/kernelsu adalah symlink rusak ke path lokal pembuatnya,
# dan hook ksu_handle_* terpasang tanpa #ifdef. Step "Source kernel" membersihkan
# itu dan membungkus hook dengan CONFIG_KSU, jadi varian stock benar-benar bersih.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repo source kernel (owner/nama)
        default: Pierre2324/NGK_android_kernel_xiaomi_sm8250
      branch:
        description: Branch source kernel
        default: t-caf
      ksu_ref:
        description: Ref KernelSU Next untuk zip KSUN (branch, tag, atau commit)
        default: legacy
      kcflags:
        description: Flag compiler tambahan (kosongkan kalau build error)
        default: "-O3"

env:
  # Identitas di /proc/version:
  #   Linux version 4.19.x-LNRKernel (LNR@LNRKernel) (LNR clang version X, LLD X) ...
  KBUILD_BUILD_USER: LNR
  KBUILD_BUILD_HOST: LNRKernel
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  # ganti string ini kalau toolchain diganti, supaya cache lama tidak terpakai
  CCACHE_COMPILERCHECK: "string:proton-clang"
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, ksu]
    env:
      VARIANT: ${{ matrix.variant }}
      W: ${{ github.workspace }}/work
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache toolchain
        id: clang_cache
        uses: actions/cache@v4
        with:
          path: ~/lnr-clang
          key: lnr-proton-clang-v1

      - name: Fetch toolchain
        if: steps.clang_cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang ~/lnr-clang
          rm -rf ~/lnr-clang/.git

      - name: Toolchain PATH
        run: echo "$HOME/lnr-clang/bin" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.variant }}-

      - name: Source kernel
        env:
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "$W"
          git clone --depth=1 -b "${BRANCH:-t-caf}" \
            "https://github.com/${REPO:-Pierre2324/NGK_android_kernel_xiaomi_sm8250}" "$W/kernel"
          cd "$W/kernel"
          test -f compile-alioth.sh || { echo "::error::compile-alioth.sh tidak ada di branch ini"; exit 1; }
          test -f arch/arm64/configs/nogravity-alioth_defconfig || { echo "::error::nogravity-alioth_defconfig tidak ada"; exit 1; }

          # ---- bersihkan KernelSU bawaan source NGK ----
          # drivers/kernelsu = symlink rusak ke path lokal; Kconfig dan Makefile memanggilnya
          # tanpa syarat, itu penyebab "can't open file drivers/kernelsu/Kconfig".
          rm -f drivers/kernelsu
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/kernelsu\//d' drivers/Makefile
          if grep -rn 'kernelsu' drivers/Kconfig drivers/Makefile; then
            echo "::error::sisa referensi kernelsu masih ada"; exit 1
          fi

          # Hook ksu_handle_* bawaan NGK tidak dibungkus #ifdef, jadi tanpa KernelSU
          # kernel gagal link. Bungkus dengan CONFIG_KSU (stock: mati, ksu: aktif).
          for f in fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c; do
            sed -i -E 's/^([[:space:]]+ksu_handle_[a-z_]+\(.*\);)$/#ifdef CONFIG_KSU\n\1\n#endif/' "$f"
            n=$(grep -c '^#ifdef CONFIG_KSU$' "$f" || true)
            [ "$n" = 1 ] || { echo "::error::hook di $f ada $n (harusnya 1), source berubah?"; exit 1; }
          done

          # Tambahan config LNR ditempel di akhir defconfig (baris terakhir menang)
          printf '\n' >> arch/arm64/configs/nogravity-alioth_defconfig
          cat >> arch/arm64/configs/nogravity-alioth_defconfig <<'EOF'
          # --- LNRKernel ---
          CONFIG_LOCALVERSION="-LNRKernel"
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_LTO_CLANG=y
          CONFIG_THINLTO=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          # CONFIG_CC_OPTIMIZE_FOR_SIZE is not set
          # CONFIG_DEBUG_INFO is not set
          EOF

      - name: Integrasi KernelSU Next (manual hook)
        if: matrix.variant == 'ksu'
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -euo pipefail
          git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next "$W/KernelSU-Next"
          git -C "$W/KernelSU-Next" checkout "${KSU_REF:-legacy}"
          git -C "$W/KernelSU-Next" log -1 --format='KernelSU Next: %h %s'

          cd "$W/kernel"
          ln -sfn ../../KernelSU-Next/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q kernelsu drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -f drivers/kernelsu/Kconfig || { echo "::error::drivers/kernelsu/Kconfig tidak terbaca"; exit 1; }

          cat >> arch/arm64/configs/nogravity-alioth_defconfig <<'EOF'
          # --- LNRKernel: KernelSU Next ---
          CONFIG_LOCALVERSION="-LNRKernel-KSUN"
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          # CONFIG_KSU_SYSCALL_TABLE_HOOK is not set
          CONFIG_OVERLAY_FS=y
          EOF

          # Hook execveat, faccessat, stat, vfs_read, dan input sudah ada di source NGK
          # (sudah dibungkus CONFIG_KSU di step sebelumnya). setresuid ditangani lewat LSM
          # hook milik KernelSU Next. Yang kurang hanya hook reboot (jalur install manager).
          # Gagal keras kalau bentuk source tidak cocok, supaya tidak menghasilkan
          # kernel "KSU" yang diam-diam tidak berfungsi.
          nm=$(grep -rhoE 'ksu_handle_(execveat|faccessat|stat|vfs_read|sys_reboot)\b|ksu_handle_input_handle_event' drivers/kernelsu/ | sort -u | tr '\n' ' ')
          echo "[LNR] simbol hook di KernelSU Next: $nm"
          for s in ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_vfs_read ksu_handle_input_handle_event ksu_handle_sys_reboot; do
            case " $nm " in *" $s "*) ;; *) echo "::error::KernelSU Next ref ini tidak punya $s"; exit 1;; esac
          done

          python3 - <<'PY'
          import pathlib, sys

          p = pathlib.Path("kernel/reboot.c")
          s = p.read_text(encoding="utf-8", errors="surrogateescape")
          anchor = "\tint ret = 0;\n\n\tif (check_poweroff_charger_mode()){"
          if "LNR-KSU" in s:
              print("[LNR] sudah dipatch: kernel/reboot.c")
          elif s.count(anchor) != 1:
              sys.exit("[LNR] anchor SYSCALL_DEFINE4(reboot) tidak ketemu di kernel/reboot.c")
          else:
              hook = ("\tint ret = 0;\n"
                      "#ifdef CONFIG_KSU /* LNR-KSU */\n"
                      "\t{\n"
                      "\t\textern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                      "\t\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                      "\t}\n"
                      "#endif\n\n"
                      "\tif (check_poweroff_charger_mode()){")
              p.write_text(s.replace(anchor, hook), encoding="utf-8", errors="surrogateescape")
              print("[LNR] hook terpasang: kernel/reboot.c")
          PY

      - name: Build (${{ matrix.variant }})
        env:
          KCFLAGS: ${{ inputs.kcflags }}
        run: |
          set -euo pipefail
          cd "$W/kernel"
          clang --version | head -n1

          # ---- banner: versi clang tetap tampil, bertanda LNR ----
          CLANG_V=$(clang --version | sed -n '1s/.*clang version \([0-9][0-9.]*\).*/\1/p')
          LLD_V=$(ld.lld --version | sed -n '1s/.*LLD \([0-9][0-9.]*\).*/\1/p')
          export LNR_CC="LNR clang version ${CLANG_V:-unknown}, LLD ${LLD_V:-unknown}"
          cat > "$W/banner.py" <<'PY'
          import os, re, pathlib
          p = pathlib.Path("scripts/mkcompile_h")
          s = p.read_text()
          new, n = re.subn(r"^([ \t]*).*#define LINUX_COMPILER.*$",
                           lambda m: m.group(1) + "echo \\#define LINUX_COMPILER \\\"" + os.environ["LNR_CC"] + "\\\"",
                           s, flags=re.M)
          if n:
              p.write_text(new)
              print("[LNR] LINUX_COMPILER ->", os.environ["LNR_CC"])
          else:
              print("::warning::LINUX_COMPILER tidak ketemu di scripts/mkcompile_h, string clang tetap bawaan")
          PY
          if grep -q KBUILD_COMPILER_STRING scripts/mkcompile_h; then
            echo "[LNR] mkcompile_h mendukung KBUILD_COMPILER_STRING -> $LNR_CC"
          else
            python3 "$W/banner.py"
          fi

          # ---- compile-alioth.sh bawaan NGK, dengan path toolchain dan identitas LNR ----
          if [ -x "$HOME/lnr-clang/bin/aarch64-linux-gnu-ld" ]; then
            P64="$HOME/lnr-clang/bin/aarch64-linux-gnu-"; P32="$HOME/lnr-clang/bin/arm-linux-gnueabi-"
          else
            P64=aarch64-linux-gnu-; P32=arm-linux-gnueabi-
          fi
          S=lnr-build.sh
          cp compile-alioth.sh "$S"
          sed -i \
            -e "s|^COMPILERDIR=.*|COMPILERDIR=\"$HOME/lnr-clang\"|" \
            -e 's|^COMPILER=.*|COMPILER="ccache clang"|' \
            -e 's|CC=\${COMPILER}|CC="${COMPILER}"|g' \
            -e "s|\${COMPILERDIR}/bin/aarch64-linux-gnu-|$P64|g" \
            -e "s|\${COMPILERDIR}/bin/arm-linux-gnueabi-|$P32|g" \
            -e '/^export KBUILD_BUILD_USER=/d' \
            -e '/^export KBUILD_BUILD_HOST=/d' \
            -e 's|KBUILD_COMPILER_STRING="[^"]*"|KBUILD_COMPILER_STRING="${LNR_CC}"|' \
            "$S"
          chk() { grep -qE "$1" "$S" || { echo "::error::patch compile-alioth.sh gagal ($1), format script berubah?"; exit 1; }; }
          chk '^COMPILER="ccache clang"'
          chk "^COMPILERDIR=\"$HOME/lnr-clang\""
          chk 'KBUILD_COMPILER_STRING="\$\{LNR_CC\}"'
          if grep -qE '^export KBUILD_BUILD_(USER|HOST)=' "$S"; then echo "::error::export KBUILD_BUILD_* masih ada"; exit 1; fi
          sh -n "$S"

          # ---- cek config ----
          MK=(make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang"
              CROSS_COMPILE="$P64" CROSS_COMPILE_COMPAT="$P32" LD=ld.lld AR=llvm-ar NM=llvm-nm
              OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip ld-name=lld)
          echo "::group::Defconfig"
          "${MK[@]}" nogravity-alioth_defconfig
          cfg() { grep -q "^$1\$" out/.config || { echo "::error::$1 tidak masuk .config (symbol Kconfig berubah?)"; exit 1; }; }
          if [ "$VARIANT" = ksu ]; then
            cfg CONFIG_KSU=y; cfg CONFIG_KSU_MANUAL_HOOK=y
          else
            if grep -q '^CONFIG_KSU=' out/.config; then echo "::error::varian stock masih punya CONFIG_KSU"; exit 1; fi
          fi
          grep -E '^CONFIG_(LOCALVERSION|LTO_CLANG|THINLTO|CFI_CLANG|SHADOW_CALL_STACK|KSU)' out/.config || true
          echo "::endgroup::"

          if [ "$VARIANT" = ksu ]; then
            # Kbuild KernelSU Next menyuntik backport (path_umount dan sejenisnya) ke fs/ saat Makefile
            # drivers/kernelsu dibaca. Dibaca duluan di sini supaya injeksi pasti selesai
            # sebelum fs/ dikompilasi.
            # flask.h / av_permissions.h (hasil genheaders) dibuat oleh security/selinux/,
            # dan dibutuhkan objsec.h yang di-include KernelSU. Jadi selinux dibuild dulu.
            echo "::group::KSU: pre-trigger Kbuild"
            "${MK[@]}" security/selinux/
            "${MK[@]}" drivers/kernelsu/
            echo "::endgroup::"
            grep -q 'path_umount' fs/internal.h || { echo "::error::injeksi backport KSU Next ke fs/ tidak terjadi"; exit 1; }
          fi

          # ---- build (script NGK tidak mengembalikan exit code error, jadi hasilnya dicek manual) ----
          echo "::group::Build kernel"
          ccache -z >/dev/null 2>&1 || true
          set +e
          sh "./$S" 2>&1 | tee "$W/build.log"
          set -e
          echo "::endgroup::"
          ccache -s || true

          O=out/outputs/alioth
          for f in dtb dtbo.img Image.gz; do
            test -s "$O/$f" || { echo "::error::$O/$f tidak ada, build gagal (lihat log)"; grep -nE 'error:|Error [0-9]' "$W/build.log" | head -20 || true; exit 1; }
          done
          if [ ! -s "$O/alioth_dtbo-miui.img" ]; then
            echo "::warning::dtbo MIUI tidak terbentuk, zip hanya membawa dtbo AOSP"
          fi
          strings "$O/Image.gz" >/dev/null 2>&1 || true
          ls -l "$O"

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.variant }}
          path: ${{ env.W }}/kernel/out/outputs/alioth/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload log build (kalau gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.variant }}
          path: ${{ env.W }}/build.log
          if-no-files-found: ignore
          retention-days: 3

  package:
    name: Package zip
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download hasil build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: out-*
          path: out

      - name: Package zip
        run: |
          set -euo pipefail
          sudo apt-get install -y zip >/dev/null
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/modules ak3/patch ak3/ramdisk

          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 - LNRKernel (POCO F3 / alioth)
          properties() { '
          kernel.string=LNRKernel by LNR
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=alioth
          device.name2=aliothin
          device.name3=POCO F3
          device.name4=Redmi K40
          device.name5=Mi 11X
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # Deteksi ROM supaya dtbo yang dipasang cocok (MIUI atau AOSP).
          # Kalau build.prop tidak terbaca, pakai dtbo AOSP.
          for m in /system /system_root /vendor /product /system_ext; do
            mount -o ro $m 2>/dev/null;
          done;
          ROM=aosp;
          for f in /system/build.prop /system/system/build.prop /system_root/system/build.prop \
                   /vendor/build.prop /product/etc/build.prop /system_ext/etc/build.prop; do
            [ -f $f ] || continue;
            if grep -qE '^ro\.(miui\.ui\.version\.(name|code)|mi\.os\.version\.name)=' $f; then ROM=miui; break; fi;
          done;
          ui_print "ROM terdeteksi: $ROM";
          if [ "$ROM" = miui ] && [ -f $home/dtbo-miui.img ]; then
            mv -f $home/dtbo-miui.img $home/dtbo.img;
          else
            rm -f $home/dtbo-miui.img;
          fi;

          # Kernel + dtb (ramdisk tidak diubah, jadi Magisk bawaan boot tetap utuh)
          dump_boot;
          write_boot;

          # dtbo
          if [ -f $home/dtbo.img ]; then
            flash_generic dtbo;
          fi;
          EOF

          D=$(date +%Y%m%d)
          fail=0
          mk() { # $1=variant dir  $2=nama zip
            src="out/out-$1"
            if [ ! -s "$src/Image.gz" ]; then
              echo "::error::build $3 gagal, tidak ada zip"; fail=1; return
            fi
            rm -rf pkg && cp -r ak3 pkg
            cp "$src/Image.gz" pkg/Image.gz
            cp "$src/dtb" pkg/dtb
            cp "$src/dtbo.img" pkg/dtbo.img
            [ -s "$src/alioth_dtbo-miui.img" ] && cp "$src/alioth_dtbo-miui.img" pkg/dtbo-miui.img
            (cd pkg && zip -r9q "../$2" . -x '.*')
            echo "dibuat: $2"; ls -l "$2"
          }
          mk stock "LNRKernel-$D-nonksu.zip" non-KSU
          mk ksu   "LNRKernel-$D-ksun.zip"   KSUN
          ls *.zip >/dev/null 2>&1 || { echo "::error::tidak ada zip yang terbentuk"; exit 1; }
          [ "$fail" = 0 ] || echo "::warning::sebagian varian gagal, hanya zip yang berhasil diunggah"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: LNRKernel-zip
          path: LNRKernel-*.zip
          if-no-files-found: error
          retention-days: 14
