name: LNRKernel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch LineageOS sm8250
        default: lineage-23.0
      variant:
        description: Varian
        type: choice
        default: standard
        options:
          - standard
          - PE+
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Build
        env:
          VARIANT: ${{ inputs.variant }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          NAME="LNRKernel"; [ "$VARIANT" = "PE+" ] && NAME="LNRKernel-PE+"
          IMG="Alioth.img"; [ "$VARIANT" = "PE+" ] && IMG="Alioth-PE+.img"
          W=$PWD/work; OUT=$W/out; mkdir -p $W; cd $W
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          git clone --depth=1 -b "$BRANCH" https://github.com/LineageOS/android_kernel_xiaomi_sm8250 kernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          # PE+: patch performa dari mengkernel (dicek bersih terhadap lineage-23.0 3a0fc935)
          if [ "$VARIANT" = "PE+" ]; then
            for c in d239fe9104241e7d7611459f1966b66ae6ee6707 4cab8bba3ee48bf045d056c894e3762b008b42c0 d2dcedb8581c4ed5ecb20ff688be7a59086d51bb e57c6b1a120570df2a5d75dd9dc9b6d307b53b34; do
              curl -fsSL "https://github.com/mengkernel/kernel_xiaomi_sm8250/commit/$c.patch" -o "$W/p.patch" \
                && git -C kernel apply --check "$W/p.patch" && git -C kernel apply "$W/p.patch" \
                && echo "APPLIED $c" || echo "SKIPPED $c"
            done
          fi

          # Hapus info builder: user@host, string compiler, hash git
          export KBUILD_BUILD_USER=LNR KBUILD_BUILD_HOST=LNR
          sed -i 's/\$CC_VERSION, \$LD_VERSION/LNR clang/' kernel/scripts/mkcompile_h
          grep -q 'LNR clang' kernel/scripts/mkcompile_h
          : > kernel/.scmversion

          cat > kernel/arch/arm64/configs/vendor/lnr-perf.config <<EOF
          CONFIG_LOCALVERSION="-$NAME"
          CONFIG_LTO_CLANG=y
          CONFIG_THINLTO=y
          CONFIG_DEBUG_INFO=n
          EOF

          KC=""
          if [ "$VARIANT" = "PE+" ]; then
            cat >> kernel/arch/arm64/configs/vendor/lnr-perf.config <<'EOF'
          # CONFIG_SCHEDSTATS is not set
          # CONFIG_SCHED_STACK_END_CHECK is not set
          # CONFIG_INIT_ON_ALLOC_DEFAULT_ON is not set
          # CONFIG_HARDENED_USERCOPY is not set
          # CONFIG_SLAB_FREELIST_HARDENED is not set
          EOF
            KC="-O3"
          fi

          cat > AnyKernel3/anykernel.sh <<EOF
          properties() { '
          kernel.string=$NAME
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=alioth
          device.name2=aliothin
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          mv -f "\$AKHOME/$IMG" "\$AKHOME/Image";
          split_boot;
          flash_boot;
          EOF

          export PATH="$W/clang/bin:$PATH" ARCH=arm64 SUBARCH=arm64
          cd kernel
          MK=(make -j"$(nproc)" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
              OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
          [ -n "$KC" ] && MK+=(KCFLAGS="$KC")
          "${MK[@]}" vendor/kona-perf_defconfig vendor/debugfs.config vendor/xiaomi/sm8250-common.config vendor/xiaomi/alioth.config vendor/lnr-perf.config
          "${MK[@]}"

          cd ../AnyKernel3
          cp "$OUT/arch/arm64/boot/Image" "$IMG"
          zip -r9 "$GITHUB_WORKSPACE/$NAME-$(date +%Y%m%d).zip" . -x '.git*' 'README.md' '*placeholder' >/dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: LNRKernel
          path: LNRKernel*.zip
